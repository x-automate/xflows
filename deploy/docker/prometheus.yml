global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: "xflows-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "xflows-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
