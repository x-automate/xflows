[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xflows-engine"
version = "0.1.0"
description = "Shared XFlows node execution engine (graph runner, registry, executors)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["xflows_engine*"]
